<div class="flex align-items-center justify-content-center p-5 " xmlns="http://www.w3.org/1999/html">
  <mat-card class="check-in-card p-4 w-3 h-15 flex align-content-start" appearance="raised">
    <mat-card-header>
      <div class="flex shadow-log align-content-center align-items-center justify-content-center">
        <span class="text-xl w-full mb-1 font-bold"> Confirmar Check-in </span>
      </div>
    </mat-card-header>
    <mat-card-content>
      <div class="member-info flex align-items-center overflow-hidden text-overflow-ellipsis mb-3">
        <div class="avatar align-items-center">
          {{ getInitials(memberPlan?.aluno?.nome || '') }}
        </div>
        <div class="flex-column">
          <div class="name font-bold">{{ memberPlan?.aluno?.nome }}</div>
          <div class="email">{{ memberPlan?.aluno?.email }}</div>
        </div>
      </div>
      <div class="flex align-items-start justify-content-start mt-3 text-sm ">
        <mat-icon>schedule</mat-icon><span> Data e Hora: {{ currentTime }}</span>
      </div>
    </mat-card-content>
    <form [formGroup]="formGroup">
      <mat-card-actions>
        <button class="w-full bg-black-alpha-90 text-white-alpha-90 border-round" mat-button (click)="confirm()">Confirmar</button>
      </mat-card-actions>
    </form>
  </mat-card>
</div>
